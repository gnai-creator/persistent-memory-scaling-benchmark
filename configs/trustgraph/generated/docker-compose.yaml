services:
  api-gateway:
    command:
    - api-gateway
    - --pubsub-backend
    - pulsar
    - --pulsar-host
    - pulsar://pulsar:6650
    - --timeout
    - '600'
    - --port
    - '8088'
    - --log-level
    - INFO
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 512M
    expose:
    - '8088'
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
  bookie:
    command:
    - bash
    - -c
    - sleep 2 && bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar
      bookie
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 1024M
    environment:
      BOOKIE_MEM: -Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
      advertisedAddress: bookie
      bookieId: bookie
      clusterName: cluster-a
      metadataStoreUri: metadata-store:zk:zookeeper:2181
      zkServers: zookeeper:2181
    expose:
    - '3181'
    image: docker.io/apachepulsar/pulsar:4.2.1
    restart: on-failure:100
    volumes:
    - bookie:/pulsar/data
  cassandra:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1400M
        reservations:
          cpus: '0.5'
          memory: 1400M
    environment:
      JVM_OPTS: -Xms700M -Xmx700M -Dcassandra.skip_wait_for_gossip_to_settle=0
    expose:
    - '9042'
    image: docker.io/cassandra:5.0.8
    restart: on-failure:100
    volumes:
    - cassandra:/var/lib/cassandra
  control:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 256M
    environment:
      IAM_BOOTSTRAP_TOKEN: ${IAM_BOOTSTRAP_TOKEN}
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/control:/etc/trustgraph/launch/
    - ./trustgraph:/etc/trustgraph/template/
  ddg-mcp-server:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 256M
    expose:
    - '9870'
    image: docker.io/trustgraph/ddg-mcp-server:0.1.1
    restart: on-failure:100
  document-decoder:
    command:
    - docling-decoder
    - --pubsub-backend
    - pulsar
    - --pulsar-host
    - pulsar://pulsar:6650
    - --log-level
    - INFO
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1400M
        reservations:
          cpus: '0.1'
          memory: 1400M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-docling:2.8.12
    restart: on-failure:100
  embeddings:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1500M
        reservations:
          cpus: '0.5'
          memory: 1500M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/embeddings:/etc/trustgraph/
  garage:
    command:
    - /garage
    - -c
    - /etc/garage/garage.toml
    - server
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      RUST_LOG: garage=info
    expose:
    - '3900'
    - '3901'
    - '3902'
    - '3903'
    - '3904'
    image: docker.io/dxflrs/garage:v2.3.0
    restart: on-failure:100
    volumes:
    - ./garage:/etc/garage/
    - garage-meta:/var/lib/garage/meta
    - garage-data:/var/lib/garage/data
  garage-init:
    command:
    - sh
    - -c
    - "set -e\n\n# Install required tools\necho \"Installing curl, jq and downloading\
      \ garage CLI...\"\napk add --no-cache curl jq\n\n# Download garage binary (v2.1.0)\
      \ for remote management\ncurl -fsSL \"https://garagehq.deuxfleurs.fr/_releases/v2.1.0/x86_64-unknown-linux-musl/garage\"\
      \ \\\n    -o /usr/local/bin/garage\nchmod +x /usr/local/bin/garage\n\necho \"\
      Waiting for Garage daemon to be ready...\"\nMAX_ATTEMPTS=60\nATTEMPT=0\n# Wait\
      \ for /health to respond (even 503 is fine - means daemon is up)\nuntil curl\
      \ -s http://garage:3903/health >/dev/null 2>&1; do\n    ATTEMPT=$$((ATTEMPT+1))\n\
      \    if [ $$ATTEMPT -ge $$MAX_ATTEMPTS ]; then\n        echo \"ERROR: Garage\
      \ failed to become ready after $${MAX_ATTEMPTS} attempts\"\n        exit 1\n\
      \    fi\n    echo \"Attempt $${ATTEMPT}/$${MAX_ATTEMPTS}: Garage not ready,\
      \ retrying in 2s...\"\n    sleep 2\ndone\necho \"Garage daemon is ready.\"\n\
      \n# Get the node ID via v2 Admin API\necho \"Getting Garage node ID via Admin\
      \ API...\"\ncurl -s -H \"Authorization: Bearer $${GARAGE_ADMIN_TOKEN}\" \\\n\
      \    \"http://garage:3903/v2/GetNodeInfo?node=self\" > /tmp/garage-node-info.json\n\
      \n# Extract node ID from response (the key in success map is the node ID)\n\
      NODE_ID=$$(jq -r '.success | to_entries[0].value.nodeId' /tmp/garage-node-info.json)\n\
      echo \"Node ID: $${NODE_ID}\"\n\nif [ -z \"$$NODE_ID\" ] || [ \"$$NODE_ID\"\
      \ = \"null\" ]; then\n    echo \"ERROR: Failed to retrieve node ID\"\n    exit\
      \ 1\nfi\n\n# ===== LAYOUT MANAGEMENT VIA REMOTE RPC =====\n# Use garage CLI\
      \ with -h and -s flags to connect remotely\n# -h requires format: <node-id>@<host>:<port>\n\
      # -s provides the RPC secret\n\n# Construct full RPC identifier\nRPC_HOST=\"\
      $${NODE_ID}@garage:3901\"\necho \"RPC Host: $${RPC_HOST}\"\n\n# Check current\
      \ layout to see if node is already assigned (idempotent)\necho \"Checking current\
      \ cluster layout...\"\nLAYOUT_OUTPUT=$$(garage -h \"$${RPC_HOST}\" -s \"$${GARAGE_RPC_SECRET}\"\
      \ layout show 2>&1)\n\n# Check if node already has a role assigned\n# Layout\
      \ output shows abbreviated node ID (first 16 chars)\nNODE_ID_SHORT=\"$${NODE_ID:0:16}\"\
      \nif echo \"$$LAYOUT_OUTPUT\" | grep -q \"$$NODE_ID_SHORT\"; then\n    echo\
      \ \"Node $${NODE_ID_SHORT}... already assigned in layout, skipping.\"\nelse\n\
      \    echo \"Assigning node to cluster layout...\"\n    # Assign node to zone\
      \ dc1 with configured capacity\n    garage -h \"$${RPC_HOST}\" -s \"$${GARAGE_RPC_SECRET}\"\
      \ \\\n        layout assign $${NODE_ID} -z dc1 -c $${GARAGE_DATA_SIZE}\n\n \
      \   echo \"Applying layout configuration...\"\n    # Get current staged version\
      \ and apply\n    garage -h \"$${RPC_HOST}\" -s \"$${GARAGE_RPC_SECRET}\" \\\n\
      \        layout apply --version 1\n\n    echo \"Layout configured successfully.\"\
      \n    # Wait for layout to stabilize\n    sleep 5\nfi\n\n# ===== KEY MANAGEMENT\
      \ VIA REMOTE RPC =====\n\n# Check if key already exists (idempotent)\n# GARAGE_ACCESS_KEY\
      \ is already a valid Garage Key ID (GK + 24 hex chars)\nif garage -h \"$${RPC_HOST}\"\
      \ -s \"$${GARAGE_RPC_SECRET}\" key info \"$${GARAGE_ACCESS_KEY}\" >/dev/null\
      \ 2>&1; then\n    echo \"Access key $${GARAGE_ACCESS_KEY} already exists, skipping\
      \ creation.\"\nelse\n    echo \"Importing S3 access key: $${GARAGE_ACCESS_KEY}\"\
      \n\n    # Import key with the provided credentials (both already in valid Garage\
      \ format)\n    # GARAGE_ACCESS_KEY = Key ID (GK + 24 hex chars)\n    # GARAGE_SECRET_KEY\
      \ = Secret (64 hex chars)\n    garage -h \"$${RPC_HOST}\" -s \"$${GARAGE_RPC_SECRET}\"\
      \ \\\n        key import \"$${GARAGE_ACCESS_KEY}\" \"$${GARAGE_SECRET_KEY}\"\
      \ --yes\n\n    echo \"Access key imported successfully.\"\nfi\n\n# Grant permissions\
      \ to the key\necho \"Granting create-bucket permission to key...\"\ngarage -h\
      \ \"$${RPC_HOST}\" -s \"$${GARAGE_RPC_SECRET}\" \\\n    key allow --create-bucket\
      \ \"$${GARAGE_ACCESS_KEY}\"\n\necho \"\"\necho \"Garage initialization complete!\"\
      \necho \"S3 Endpoint: http://garage:3900\"\necho \"Region: $${GARAGE_REGION}\"\
      \nexit 0\n"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      GARAGE_ACCESS_KEY: GK000000000000000000000001
      GARAGE_ADMIN_TOKEN: batts-rockhearted-unpartially
      GARAGE_DATA_SIZE: 5G
      GARAGE_REGION: garage
      GARAGE_RPC_SECRET: bbba746a9e289bad64a9e7a36a4299dac8d6e0b8cc2a6c2937fe756df4492008
      GARAGE_SECRET_KEY: b171f00be9be4c32c734f4c05fe64c527a8ab5eb823b376cfa8c2531f70fc427
    image: docker.io/alpine:3.23.2
    restart: on-failure:100
    volumes:
    - ./garage:/etc/garage/
  grafana:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      GF_ANALYTICS_REPORT_WHATS_NEW: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview-dashboard.json
      GF_FEATURE_TOGGLES_ASSISTANT: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_ORG_NAME: trustgraph.ai
      GF_PANELS_DISABLE_NEWS_FEED: 'true'
      GF_PLUGINS_EXCLUDE_APPS: grafana-assistant-app
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
    image: docker.io/grafana/grafana:13.0.1
    ports:
    - 3000:3000
    restart: on-failure:100
    volumes:
    - grafana-storage:/var/lib/grafana
    - ./grafana/provisioning/:/etc/grafana/provisioning/dashboards/
    - ./grafana/provisioning/:/etc/grafana/provisioning/datasources/
    - ./grafana/dashboards/:/var/lib/grafana/dashboards/
  ingest:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 256M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/ingest:/etc/trustgraph/
  loki:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 350M
        reservations:
          cpus: '0.5'
          memory: 350M
    expose:
    - '3100'
    image: docker.io/grafana/loki:3.7.2
    restart: on-failure:100
    volumes:
    - ./loki:/etc/loki/
    - loki-data:/loki
  prometheus:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 256M
    expose:
    - '9090'
    image: docker.io/prom/prometheus:v3.11.3
    restart: on-failure:100
    volumes:
    - ./prometheus:/etc/prometheus/
    - prometheus-data:/prometheus
  pulsar:
    command:
    - bash
    - -c
    - bin/apply-config-from-env.py conf/broker.conf && exec bin/pulsar broker
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 800M
        reservations:
          cpus: '0.1'
          memory: 800M
    environment:
      PULSAR_MEM: -Xms384m -Xmx384m -XX:MaxDirectMemorySize=384m
      advertisedAddress: pulsar
      advertisedListeners: external:pulsar://pulsar:6650,localhost:pulsar://localhost:6650
      clusterName: cluster-a
      exposeConsumerLevelMetricsInPrometheus: 'false'
      exposeProducerLevelMetricsInPrometheus: 'false'
      managedLedgerDefaultAckQuorum: '1'
      managedLedgerDefaultEnsembleSize: '1'
      managedLedgerDefaultWriteQuorum: '1'
      metadataStoreUrl: zk:zookeeper:2181
      zookeeperServers: zookeeper:2181
    expose:
    - '6650'
    - '8080'
    image: docker.io/apachepulsar/pulsar:4.2.1
    restart: on-failure:100
  pulsar-init:
    command:
    - bash
    - -c
    - sleep 10 && bin/pulsar initialize-cluster-metadata --cluster cluster-a --zookeeper
      zookeeper:2181 --configuration-store zookeeper:2181 --web-service-url http://pulsar:8080
      --broker-service-url pulsar://pulsar:6650
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 256M
    environment:
      PULSAR_MEM: -Xms128m -Xmx128m -XX:MaxDirectMemorySize=128m
    image: docker.io/apachepulsar/pulsar:4.2.1
    restart: on-failure:100
  qdrant:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 1024M
    expose:
    - '6333'
    - '6334'
    image: docker.io/qdrant/qdrant:v1.18.0
    restart: on-failure:100
    volumes:
    - qdrant:/qdrant/storage
  rag:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 640M
        reservations:
          cpus: '0.1'
          memory: 640M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/rag:/etc/trustgraph/
  rows:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 768M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/rows:/etc/trustgraph/
  text-completion:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 128M
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/text-completion:/etc/trustgraph/
  triples:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 512M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/triples:/etc/trustgraph/
  trustgraph-ui:
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 256M
    image: docker.io/trustgraph/trustgraph-ui:1.2.3
    ports:
    - 8888:8888
    restart: on-failure:100
    volumes:
    - ./ui/config:/usr/lib/python3.12/site-packages/trustgraph_ui/ui/config/
    - ./ui/bundle:/usr/lib/python3.12/site-packages/trustgraph_ui/ui/bundle/
  vector-store:
    command:
    - processor-group
    - --log-level
    - INFO
    - -c
    - /etc/trustgraph/launch.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 256M
    expose:
    - '8000'
    image: docker.io/trustgraph/trustgraph-flow:2.8.12
    restart: on-failure:100
    volumes:
    - ./launch/vector-store:/etc/trustgraph/
  zookeeper:
    command:
    - bash
    - -c
    - bin/apply-config-from-env.py conf/zookeeper.conf && bin/generate-zookeeper-config.sh
      conf/zookeeper.conf && exec bin/pulsar zookeeper
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 512M
    environment:
      PULSAR_MEM: -Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
      metadataStoreUrl: zk:zookeeper:2181
    expose:
    - '2181'
    - '2888'
    - '3888'
    image: docker.io/apachepulsar/pulsar:4.2.1
    restart: on-failure:100
    volumes:
    - zookeeper:/pulsar/data
volumes:
  bookie: {}
  cassandra: {}
  garage-data: {}
  garage-meta: {}
  grafana-storage: {}
  loki-data: {}
  prometheus-data: {}
  qdrant: {}
  zookeeper: {}
